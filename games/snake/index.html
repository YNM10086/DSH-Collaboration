<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 4px; color: #0f3460; }
    #score { font-size: 18px; margin-bottom: 12px; color: #e94560; font-weight: bold; }
    canvas {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(233, 69, 96, 0.25);
    }
    #tip { margin-top: 12px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div id="score">得分：0</div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="tip">方向键 / WASD 控制，空格暂停</div>

  <script src="snake.js"></script>
  <script src="game.js"></script>
</body>
</html>
